name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node --test
      - name: Build the store package
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
